eaviest factor in the score."},{h:"Managing it without thinking about it",p:"An auto-debit of the full statement amount removes the late-payment risk entirely. Statement alerts and a calendar note two days before the due date do the same job manually. Annual fees, cash-withdrawal charges and forex mark-ups are in the card's tariff sheet, the same way a fund's costs are in its expense ratio."}]},"emi-basics":{title:"EMIs without surprises",minutes:3,tag:"Loans",teaser:"What an EMI is made of, what happens if one is missed, and the rights every borrower keeps.",sections:[{h:"What an EMI is made of",p:"Each instalment is part interest, part principal. Early in the loan the interest share is largest, because interest is charged on the balance still outstanding; by the final months almost all of the EMI is principal."},{h:"If an EMI is missed",p:"The lender charges a penalty, and the missed payment reaches the credit bureaus, where it stays on the report for years. A single missed EMI typically costs more score points than a high utilisation month."},{h:"Rights that stay with you",p:"RBI rules for digital loans give a cooling-off window to exit at pro-rata interest, require a named grievance officer, and cap penal charges. Floating-rate loans can be prepaid without penalty; fixed-rate personal loans may carry a prepayment fee stated in the Key Fact Statement."}]},"score-mechanics":{title:"What moves a credit score",minutes:2,tag:"Credit",teaser:"The five inputs bureaus weigh, and which ones move fastest.",sections:[{h:"The heavy inputs",p:"Payment history and utilisation carry the most weight. Both update monthly, so they are also the fastest movers, in both directions."},{h:"The slow inputs",p:"Age of credit history only grows with time, and credit mix changes only when accounts open or close. Hard enquiries fade after about a year."},{h:"What does not touch it",p:"Checking your own score, income, savings balances and investment holdings are not in the score. A bureau score measures borrowing behaviour, not wealth."}]},"sip-mechanics":{title:"How a SIP builds value",minutes:2,tag:"Investing",teaser:"Why a fixed monthly amount buys more units when markets fall, and what that does to your average cost.",sections:[{h:"Fixed money, variable units",p:"A SIP invests the same rupee amount every month, so it buys more units when the NAV is low and fewer when it is high. Your own statement shows this: the same ₹10,000 instalment bought 190 units in 2022 and 127 units in 2025 as the NAV rose."},{h:"Why XIRR is the fair measure",p:"Because each instalment has its own start date, a simple return over- or under-states the result. XIRR weighs every instalment by exactly how long it was invested, which is why the app leads with it."}]},"benchmark-reading":{title:"Reading a benchmark gap",minutes:2,tag:"Investing",teaser:"What it means when your fund and its index part ways, and what a gap cannot tell you.",sections:[{h:"Same window or it does not count",p:"A fund return and an index return are only comparable over identical dates. The app clamps both to the same window before showing a gap."},{h:"What a gap is not",p:"An index carries no expense ratio, exit load or tax, so a small lag is partly cost, not skill. And a past gap in either direction is a record, not a forecast."}]}},NY={credit:{lead:"You have your score. This is what connects to it in Finanz.",items:[{type:"lesson",id:"credit-card-habits",banner:!0},{type:"lesson",id:"score-mechanics"},{type:"view",view:"loans",title:"What this score gets",blurb:"Demo loan offers priced on your band, with the full cost shown first",tag:"Loans"},{type:"view",view:"home",title:"Your portfolio",blurb:"The investing side of your money, explained the same way",tag:"Portfolio"}]},loans:{lead:"Borrowing connects to the rest of your money. Related in Finanz:",items:[{type:"lesson",id:"emi-basics",banner:!0},{type:"view",view:"credit",title:"Your credit score",blurb:"The number these offers were priced on, f
